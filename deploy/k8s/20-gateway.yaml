# Gateway Deployment + Service + HorizontalPodAutoscaler.
#
# The gateway is STATELESS, so it is a Deployment (interchangeable pods) and can
# be horizontally autoscaled — the "HPA scaled" box in the architecture diagram.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: storagemesh
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: storagemesh:latest
          imagePullPolicy: IfNotPresent
          command: ["gateway"]
          env:
            - { name: LISTEN, value: ":8080" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: mesh-secrets, key: DATABASE_URL } }
            - name: ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mesh-secrets, key: ACCESS_KEY } }
            - name: PRESIGN_SECRET
              valueFrom: { secretKeyRef: { name: mesh-secrets, key: PRESIGN_SECRET } }
            # Per-pod DNS names from the headless storage Service.
            - name: STORAGE_NODES
              value: "http://storage-0.storage:8081,http://storage-1.storage:8081,http://storage-2.storage:8081"
            - { name: REPLICATION, value: "3" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: storagemesh
spec:
  type: LoadBalancer          # or ClusterIP + Ingress in a real cluster
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: storagemesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
